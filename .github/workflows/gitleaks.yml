name: Gitleaks Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the open-source gitleaks CLI directly. The CLI is MIT-licensed and
      # free; only the gitleaks-action wrapper requires a paid GITLEAKS_LICENSE
      # for organization-owned repos, so we avoid it here.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `gitleaks dir` scans the checked-out working tree and exits non-zero
      # (default exit code 1) when any secret is detected, failing the job.
      - name: Run gitleaks
        run: gitleaks dir . --redact --verbose
